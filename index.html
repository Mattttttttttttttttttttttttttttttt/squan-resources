<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e12" />
  <meta name="description" content="All your Square-1 resources in one place." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Squan Resources" />

  <title>Squan Resources</title>

  <!-- Outfit for body · Unbounded for SquanGo logo -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="topbar">
    <a href=".." class="squango" aria-label="SquanGo home">
      <span class="squango-sq">Squan</span><span class="squango-go">Go</span>
    </a>
    <div class="nav-divider" aria-hidden="true"></div>
    <a href="./roadmap" class="topbar-link">roadmap</a>
    <button class="topbar-feedback-btn" id="feedback-btn" aria-label="Submit feedback">feedback</button>
  </header>

  <main>
    <h1 class="main-title" id="main-title" role="link" tabindex="0">Squan Resources</h1>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
    <div class="content-area" id="content-area" role="main"></div>
  </main>
  <footer class="site-footer">Made &amp; Maintained by Matt</footer>

  <div class="feedback-backdrop" id="feedback-backdrop" role="dialog" aria-modal="true" aria-label="Submit feedback">
    <div class="modal feedback-modal" id="feedback-modal">
      <button class="modal-close" id="feedback-close" aria-label="Close">&times;</button>
      <div class="modal-inner">
        <div class="modal-header">
          <span class="modal-title">Submit Feedback</span>
        </div>
        <div class="modal-sep"></div>
        <div class="feedback-body">
          <p>To report an error or suggest a new resource, email us at: <b>squango.team@gmail.com</b></p>
          <p>Alternatively, say something in the <a href="https://discord.gg/eu2rqzAREh" target="blank" class="feedback-link">squan discord server</a>.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-label="Resource details">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-inner" id="modal-inner"></div>
    </div>
  </div>

  <script src="resources.js"></script>
  <script src="app.js"></script>
</body>

</html>
