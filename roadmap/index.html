<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e12" />
  <meta name="description" content="Square-1 progression roadmap." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Roadmap — Squan Resources</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared site styles for topbar, variables, base reset -->
  <link rel="stylesheet" href="../styles.css" />
  <!-- Roadmap-specific styles -->
  <link rel="stylesheet" href="roadmap.css" />
</head>

<body>

  <header class="topbar">
    <a href=".." class="squango" aria-label="SquanGo home">
      <span class="squango-sq">Squan</span><span class="squango-go">Go</span>
    </a>
    <div class="nav-divider" aria-hidden="true"></div>
    <a href=".." class="topbar-link">resources</a>
    <button class="topbar-feedback-btn" id="feedback-btn" aria-label="Submit feedback">feedback</button>
  </header>

  <a href=".." class="roadmap-nudge roadmap-nudge--left" aria-label="Go to resources">
    <svg class="roadmap-nudge-arrow" viewBox="-4 0 52 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M28 6 L8 22 L28 38" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M8 22 H46" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="roadmap-nudge-label" style="transform: translateX(8px)">resources</span>
  </a>

  <main class="roadmap-main">
    <h1 class="main-title roadmap-title" id="main-title">
      <a href=".." class="roadmap-title-link">Squan Resources</a>
    </h1>
    <p class="roadmap-subtitle">Progression Roadmap</p>

    <!-- Tab description — populated by JS from first string element of tab array -->
    <p class="roadmap-tab-desc" id="roadmap-tab-desc" hidden></p>

    <!-- Tab switcher — populated by JS -->
    <div class="tab-switcher" id="tab-switcher" role="tablist" aria-label="Select method"></div>

    <!-- Roadmap steps — populated by JS -->
    <div class="roadmap-container" id="roadmap-container" role="main"></div>
    <a href=".." class="mobile-page-tab" id="mobile-page-tab" aria-label="Go to resources">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8H2M7 3L2 8l5 5"/></svg>
      go to resources
    </a>
  </main>
  <footer class="site-footer">Made &amp; Maintained by Matt</footer>

  <div class="feedback-backdrop" id="feedback-backdrop" role="dialog" aria-modal="true" aria-label="Submit feedback">
    <div class="modal feedback-modal" id="feedback-modal">
      <button class="modal-close" id="feedback-close" aria-label="Close">&times;</button>
      <div class="modal-inner">
        <div class="modal-header">
          <span class="modal-title">Submit Feedback</span>
        </div>
        <div class="modal-sep"></div>
        <div class="feedback-body">
          <p>To report an error or suggest a new resource, email us at: <b>squango.support@gmail.com</b></p>
          <p>Alternatively, say something in the <a href="https://discord.gg/eu2rqzAREh" target="blank"
              class="feedback-link">squan discord server</a>.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Load resources for featured-resource lookup -->
  <script src="../resources.js"></script>
  <script src="roadmap.js"></script>
  <script src="roadmap-app.js"></script>
</body>

</html>
